{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Western blot calibration{% endblock %}</title>
<link rel="icon" href="{% static 'core/up-logo.ico' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one reading column for words, a two-pane bench for rating. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2430; --muted: #5b6675;
    --rule: #dde1e7; --rule-strong: #8a93a0; --accent: #10428a; --accent-ink: #ffffff;
    --accent-soft: #e6edf8; --warn: #8a3b12; --warn-soft: #fbeee6; --ok: #1d6b45;
    --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1b2129; --ink: #e7ebf0; --muted: #a2acb9;
    --rule: #2c3440; --rule-strong: #6d7785; --accent: #7fa8e8; --accent-ink: #0d1520;
    --accent-soft: #1d2a3d; --warn: #f0a77d; --warn-soft: #3a2418; --ok: #6fcf9a; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12161c; --surface: #1b2129; --ink: #e7ebf0; --muted: #a2acb9;
    --rule: #2c3440; --rule-strong: #6d7785; --accent: #7fa8e8; --accent-ink: #0d1520;
    --accent-soft: #1d2a3d; --warn: #f0a77d; --warn-soft: #3a2418; --ok: #6fcf9a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); }
  .bar { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 12px 20px;
         display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .bar b { color: var(--accent); letter-spacing: .02em; }
  .bar span { color: var(--muted); font-size: .9rem; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  main.wide { max-width: 1180px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .4em; text-wrap: balance; font-weight: 600; }
  h2 { font-size: 1.15rem; margin: 1.8em 0 .5em; font-weight: 600; }
  p { margin: 0 0 1em; }
  .lead { font-size: 1.05rem; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; }
  label { font-weight: 500; }
  .field { display: grid; gap: 4px; margin-bottom: 16px; }
  .hint { color: var(--muted); font-size: .88rem; font-weight: 400; }
  input[type=text], input[type=email], input[type=number], select, textarea {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong);
    border-radius: 6px; padding: 9px 10px; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  .error { color: var(--warn); font-size: .9rem; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0;
         border-radius: 8px; padding: 11px 20px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.quiet { background: transparent; color: var(--accent); padding-left: 0; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  .scroll { overflow-x: auto; }
  .criteria-svg { width: 100%; height: auto; display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="bar"><b>Only Good Antibodies</b><span>Western blot calibration study</span></header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
