{% load static crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile – OGA Academy</title>

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  <link rel="stylesheet" href="{% static 'academy/css/style.css' %}">

  <style>
    :root {
      --main-blue: #10428a;
      --accent-blue: #86bef0;
      --light-bg: #f8faff;
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Open Sans', sans-serif;
    }

    /* Page Container */
    .edit-container {
      padding: 4rem 1rem;
    }

    /* Card */
    .edit-card {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 6px 25px rgba(16, 66, 138, 0.1);
    }

    .edit-card .card-body {
      padding: 2.5rem 3rem;
    }

    /* Title */
    .edit-title {
      color: var(--main-blue);
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Button */
    .btn-save {
      background-color: var(--main-blue);
      color: white;
      font-weight: 600;
      border-radius: 50px;
      padding: 0.7rem;
      transition: background-color 0.3s ease;
    }

    .btn-save:hover {
      background-color: var(--accent-blue);
    }

    /* Add space before footer */
    .edit-container {
      padding-bottom: 6rem;
    }
  </style>
</head>

<body>

{% include 'academy/header.html' %}


<!-- Main Content -->
<main class="edit-container">
  <div class="card edit-card">
    <div class="card-body">

      <h2 class="edit-title">Complete Your Profile</h2>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-save w-100 mt-3">
          Save Changes
        </button>
      </form>

    </div>
  </div>
</main>


<!-- Footer -->
{% include 'core/footer.html' %}

<script src="{% static 'core/script.js' %}"></script>

</body>
</html>
